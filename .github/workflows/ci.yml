name: OneTips CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  UV_PYTHON: '3.13'

jobs:
  framework:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run --locked mypy
      - run: uv run --locked pyrefly check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m unittest discover -s tests -v
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build, compare and benchmark pure and native wheels
        run: uv run --locked python scripts/acceptance.py --build-wheels
      - uses: actions/setup-node@v6
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Linux'
        with:
          bun-version: 'latest'
      - name: Verify copies and locks with pinned skills installer
        if: runner.os == 'Linux'
        run: uv run --locked python scripts/acceptance.py
      - name: Verify examples/typescript-tips
        if: runner.os == 'Linux'
        working-directory: examples/typescript-tips
        run: |
          uv run --project ../.. --locked onetips index --check
          uv run --project ../.. --locked onetips check
          uv run --project ../.. --locked onetips snippets
          uv run --project ../.. --locked onetips verify skills/typescript-tips

  python-312:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked python --version
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked onetips --version
      - name: Verify pure Python wheel in clean Python 3.12 environment
        run: |
          uv build --python 3.12 --wheel --out-dir dist-312
          uv venv --python 3.12 .venv-wheel-312
          uv pip install --python .venv-wheel-312/bin/python dist-312/*-py3-none-any.whl
          .venv-wheel-312/bin/onetips --version
          .venv-wheel-312/bin/onetips verify fixtures/minimal/skills/acme-tips
