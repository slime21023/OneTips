[build-system]
requires = ["setuptools==84.2.1", "mypy[mypyc]==2.4.1"]
build-backend = "setuptools.build_meta"

[project]
name = "onetips"
version = "0.1.0.dev0"
description = "Create, validate, and query OneTips Markdown tips packaged as Agent Skills."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7", "markdown-it-py>=4,<5"]

[project.scripts]
onetips = "onetips.cli:main"

[dependency-groups]
dev = ["mypy[mypyc]==2.4.1", "types-PyYAML>=6.0.12,<7", "ruff==0.17.6", "pyrefly==1.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onetips = ["py.typed"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/onetips"]

[tool.pyrefly]
project-includes = ["src/onetips"]
python-version = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 130
src = ["src", "tests", "scripts"]
extend-exclude = ["*.md", "fixtures"]  # Markdown fences are fixture content, not code to reformat

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear: likely bugs
    "UP",           # pyupgrade
    "SIM",          # simplifications
    "C4",           # comprehensions
    "RET",          # return consistency
    "PIE", "PL",    # misc, pylint
    "RUF",          # ruff-specific
    "PTH",          # pathlib over os.path
    "TRY", "EM",    # exception style
    "T20",          # no stray print (cli/ is exempt below)
    "S",            # security
    "A",            # builtin shadowing
    "ARG",          # unused arguments
    "ERA",          # commented-out code
    "N",            # naming
    "C90",          # mccabe complexity (threshold below)
]
ignore = [
    "TRY003",  # long messages in exceptions are the user-facing text
    "EM101", "EM102",
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # complexity thresholds judged in review
    "S603", "S602", "S607",  # snippet runner executes author-configured commands by design
]

[tool.ruff.lint.per-file-ignores]
"src/onetips/cli/*" = ["T201"]
"src/onetips/scaffold.py" = ["T201", "E501"]  # generated Markdown templates are prose lines
"tests/*" = ["S101", "S603", "S607", "PLR2004", "ARG", "S105"]
"scripts/*" = ["T201", "S101", "S603", "S607", "S602"]
"src/onetips/adapters/markdown.py" = ["ARG002"]  # token handlers share one signature

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
